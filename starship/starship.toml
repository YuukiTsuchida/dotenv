[directory]
truncation_length = 8
truncate_to_repo = true

# Gitの状態を詳しく
[git_branch]
format = "[$symbol$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'

# コマンド実行時間（長いコマンドのみ表示）
[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "

# プロンプトの改行
add_newline = true